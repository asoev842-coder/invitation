<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a52">
<meta name="robots" content="noindex">
<title>Ссылки для гостей</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap&subset=cyrillic">
<style>
:root { --bg:#0a2a52; --bg2:#0e3a6e; --ink:#e8f4fd; --soft:#b7ddf7; --line:rgba(183,221,247,.35); --btn:#b7ddf7; --btn-ink:#0a2a52; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background: var(--bg); color: var(--ink); font: 17px/1.45 "Cormorant Garamond", Georgia, serif; min-height:100vh;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
main { max-width: 620px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font: italic 500 32px/1.15 "Playfair Display", Georgia, serif; margin: 4px 0 0; color: var(--soft); }
p { margin: 0; color: var(--ink); opacity: .9; }
label { display:block; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:13px; color: var(--soft); margin-bottom:6px; }
textarea, select { width:100%; font: 600 18px "Cormorant Garamond", Georgia, serif; color: var(--ink); background: var(--bg2); border:1px solid var(--line); border-radius: 10px; padding: 12px; }
textarea { min-height: 130px; resize: vertical; }
button { font: 700 15px "Cormorant Garamond", Georgia, serif; letter-spacing:.06em; text-transform: uppercase; color: var(--btn-ink); background: var(--btn); border:0; border-radius: 10px; padding: 11px 16px; cursor:pointer; }
button.ghost { background: transparent; color: var(--soft); border:1px solid var(--line); }
button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--soft); outline-offset: 2px; }
.list { display:grid; gap:12px; }
.row { border:1px solid var(--line); border-radius: 12px; padding: 12px; background: rgba(14,58,110,.55); display:grid; gap:8px; min-width:0; }
.row b { font: italic 500 21px "Playfair Display", Georgia, serif; color: var(--ink); overflow-wrap:anywhere; }
.row input { width:100%; font: 14px ui-monospace, Menlo, monospace; color: var(--soft); background: transparent; border:1px dashed var(--line); border-radius:8px; padding:8px; min-width:0; }
.acts { display:flex; gap:8px; flex-wrap:wrap; }
.note { font-size: 15px; opacity:.75; }
</style>
</head>
<body>
<main>
  <h1>Ссылки для гостей</h1>
  <p>Впишите имена гостей, по одному на строку. Для каждого получится своя ссылка на то же приглашение.</p>
  <div>
    <label for="names">Гости</label>
    <textarea id="names" placeholder="Ака Хаджи&#10;Рустам Одинаев&#10;Зарина"></textarea>
  </div>
  <div>
    <label for="suffix">Что дописать после имени</label>
    <select id="suffix">
      <option value="и его семью">и его семью</option>
      <option value="и её семью">и её семью</option>
      <option value="и вашу семью">и вашу семью</option>
      <option value="">ничего (только имя)</option>
    </select>
  </div>
  <div class="acts"><button id="go" type="button">Создать ссылки</button><button class="ghost" id="copyall" type="button" hidden>Скопировать все</button></div>
  <div class="list" id="list"></div>
  <p class="note">Если в строке уже есть « и » (например, «Рустам и Малика»), текст останется как есть.</p>
</main>
<script>
const base = location.href.replace(/[^/]*$/, "") ;      // папка, где лежит это приглашение
const $ = id => document.getElementById(id);
function build(line, suffix) {
  const text = /\s+и\s+/i.test(line) || !suffix ? line : line + " " + suffix;
  return { text, url: base + "?g=" + encodeURIComponent(text) };
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Скопировано"; }
  catch (e) { const i = btn.closest(".row") && btn.closest(".row").querySelector("input"); if (i) { i.select(); } btn.textContent = "Выделено, скопируйте"; }
  setTimeout(() => btn.textContent = btn.dataset.l, 1800);
}
let current = [];
$("go").addEventListener("click", () => {
  const suffix = $("suffix").value;
  const lines = $("names").value.split("\n").map(x => x.trim()).filter(Boolean);
  current = lines.map(l => build(l, suffix));
  const list = $("list"); list.innerHTML = "";
  current.forEach(({ text, url }) => {
    const row = document.createElement("div"); row.className = "row";
    const b = document.createElement("b"); b.textContent = text;
    const inp = document.createElement("input"); inp.readOnly = true; inp.value = url; inp.addEventListener("focus", () => inp.select());
    const acts = document.createElement("div"); acts.className = "acts";
    const c = document.createElement("button"); c.type = "button"; c.textContent = c.dataset.l = "Копировать"; c.addEventListener("click", () => copy(url, c));
    acts.appendChild(c);
    if (navigator.share) {
      const sh = document.createElement("button"); sh.type = "button"; sh.className = "ghost"; sh.textContent = "Поделиться";
      sh.addEventListener("click", () => navigator.share({ title: "Приглашение", text: "Приглашение на свадьбу Исмаила и Зухры", url }).catch(() => {}));
      acts.appendChild(sh);
    }
    const o = document.createElement("a"); o.href = url; o.target = "_blank"; o.rel = "noopener"; o.style.cssText = "align-self:center;color:var(--soft);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px";
    o.textContent = "Открыть"; acts.appendChild(o);
    row.append(b, inp, acts); list.appendChild(row);
  });
  $("copyall").hidden = !current.length; $("copyall").dataset.l = "Скопировать все";
});
$("copyall").addEventListener("click", e => copy(current.map(c => c.text + "\n" + c.url).join("\n\n"), e.currentTarget));
</script>
</body>
</html>
